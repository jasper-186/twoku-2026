name: Release

on:
  push:
    tags:
      - 'v*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3. Leave empty for a dev build.'
        required: false
        type: string
      publish_release:
        description: 'Publish a GitHub Release with the Roku package attached.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      major: ${{ steps.meta.outputs.major }}
      minor: ${{ steps.meta.outputs.minor }}
      build: ${{ steps.meta.outputs.build }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$INPUT_VERSION"
            source="input"
            if [ -z "$raw" ]; then
              raw="0.0.0-dev.$RUN_NUMBER"
              source="auto-dev"
            fi
          else
            raw="$REF_NAME"
            source="tag"
          fi

          version="$raw"
          while true; do
            case "$version" in
              release-*) version="${version#release-}" ;;
              v*)       version="${version#v}" ;;
              *)        break ;;
            esac
          done
          version="${version//+/_}"

          if [ "$source" = "tag" ]; then
            release_tag="$REF_NAME"
          else
            release_tag="v$version"
          fi

          major=""
          minor=""
          if [ "$source" != "auto-dev" ]; then
            if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
            fi
          else
            last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$last_tag" ]; then
              last_version="${last_tag#release-}"
              last_version="${last_version#v}"
              if [[ "$last_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
                major="${BASH_REMATCH[1]}"
                minor="${BASH_REMATCH[2]}"
              fi
            fi
          fi

          manifest_major=$(sed -n 's/^major_version=\([0-9]*\).*/\1/p' roku/manifest)
          manifest_minor=$(sed -n 's/^minor_version=\([0-9]*\).*/\1/p' roku/manifest)
          if [ -z "$major" ]; then
            major="${manifest_major:-0}"
            minor="${manifest_minor:-0}"
          elif [ "$major" -lt "$manifest_major" ] ||
               { [ "$major" -eq "$manifest_major" ] && [ "$minor" -lt "$manifest_minor" ]; }; then
            major="$manifest_major"
            minor="$manifest_minor"
          fi

          build="$RUN_NUMBER"
          if [ "$build" -gt 65535 ]; then
            echo "::error::run number $build exceeds the Roku build_version limit of 65535" >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            publish="${INPUT_PUBLISH_RELEASE:-true}"
          else
            publish=true
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}/backend"

          {
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "major=$major"
            echo "minor=$minor"
            echo "build=$build"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

          {
            echo "version:      $version"
            echo "release tag:  $release_tag"
            echo "manifest:     major=$major minor=$minor build=$build"
            echo "prerelease:   $prerelease"
            echo "publish:      $publish"
            echo "image:        $image"
          } >> "$GITHUB_STEP_SUMMARY"

  backend-image:
    name: Backend image
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}
            ${{ needs.meta.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          tag="$IMAGE:$VERSION"

          echo "== manage.py check =="
          docker run --rm --entrypoint python "$tag" manage.py check

          echo "== serving the device page =="
          docker run -d --name twoku-smoke -p 18080:8080 "$tag"
          trap 'docker rm -f twoku-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/; then
              break
            fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:18080/
          echo "device page served"

      - name: Push the image
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail

          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"

          if [ "$PRERELEASE" != true ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

          digest=$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION" || true)
          echo "image: $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: $digest" >> "$GITHUB_STEP_SUMMARY"

  roku-package:
    name: Roku package
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile-check the BrightScript
        run: |
          npx --yes -p brighterscript@0.73.8 bsc \
            --root-dir roku \
            --create-package false --copy-to-staging false \
            --diagnostic-level error

      - name: Write the env file
        if: vars.ROKU_BASE_URL != ''
        env:
          ROKU_BASE_URL: ${{ vars.ROKU_BASE_URL }}
        run: |
          set -euo pipefail
          printf 'BASE-URL=%s\n' "$ROKU_BASE_URL" > roku/env

      - name: Stamp the manifest
        env:
          MAJOR: ${{ needs.meta.outputs.major }}
          MINOR: ${{ needs.meta.outputs.minor }}
          BUILD: ${{ needs.meta.outputs.build }}
        run: |
          set -euo pipefail
          if [ -n "$MAJOR" ]; then
            sed -i "s/^major_version=.*/major_version=$MAJOR/" roku/manifest
            sed -i "s/^minor_version=.*/minor_version=$MINOR/" roku/manifest
          fi
          sed -i "s/^build_version=.*/build_version=$(printf '%05d' "$BUILD")/" roku/manifest
          grep -E '^(major|minor|build)_version' roku/manifest

      - name: Package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ./roku/package.sh "$GITHUB_WORKSPACE/dist/twoku-$VERSION.zip"
          cd dist
          sha256sum "twoku-$VERSION.zip" > "twoku-$VERSION.zip.sha256"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: roku-package
          path: dist/
          retention-days: 7
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [meta, backend-image, roku-package]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: roku-package
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Twoku ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/twoku-${{ needs.meta.outputs.version }}.zip
            dist/twoku-${{ needs.meta.outputs.version }}.zip.sha256
