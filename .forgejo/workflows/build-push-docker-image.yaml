name: build-push-docker-image

on:
  push:
    tags:
      - release-*
  workflow_dispatch:

jobs:
  build:
    runs-on: docker-ubuntu-x86
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Extract the correct tag
        id: extract_tag
        run: echo "tag=$(echo "${{ env.GITHUB_REF_NAME }}" | grep -oP '(?<=release-v)[^/]+')" >> "$GITHUB_OUTPUT"
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.example.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: registry.example.dev/twoku-webapp:latest,registry.example.dev/twoku-webapp:${{ steps.extract_tag.outputs.tag }}
          context: ./backend
          file: ./backend/Dockerfile
